<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NUR — Design System & Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NUR — Design Tokens
   ============================================================ */
:root{
  --bg:#0B0B0B;
  --surface:#141414;
  --surface-2:#1A1A1A;
  --surface-3:#212121;
  --border:#292929;
  --border-strong:#383838;
  --text-primary:#F2F2F0;
  --text-secondary:#A6A6A3;
  --text-tertiary:#6E6E6B;
  /* --accent = literal brand color, used for solid fills (buttons, brand mark, dots).
     --accent-strong = foreground-safe tone for text/icons/strokes/borders on top of
     dark surfaces (contrast-checked ~5.5:1); on light theme it runs darker instead. */
  --accent:#FF5C00;
  --accent-strong:#FF8A47;
  --accent-dim:#E65200;
  --accent-tint:rgba(255,92,0,0.18);
  --accent-tint-strong:rgba(255,92,0,0.30);
  --on-accent:#1B1006;
  --success:#7FA06E;
  --success-tint:rgba(127,160,110,0.16);
  --warning:#C98A3D;
  --warning-tint:rgba(201,138,61,0.16);
  --danger:#C5645A;
  --danger-tint:rgba(197,100,90,0.16);
  --info:#7C93AE;

  --font-display:'Somar Sans','Inter',sans-serif;
  --font-body:'Somar Sans','Inter',sans-serif;
  --font-arabic:'Somar Sans','IBM Plex Sans Arabic','Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-10:64px;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;

  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 8px 24px rgba(0,0,0,.5);
  --shadow-glow:0 0 0 1px rgba(255,138,71,.3), 0 0 24px rgba(255,138,71,.18);

  --dur-1:120ms; --dur-2:220ms;
  --ease:cubic-bezier(.4,0,.2,1);
}

html[data-theme="light"]{
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#F0F0EE;
  --surface-3:#E6E6E2;
  --border:#DEDEDA;
  --border-strong:#CCCCC6;
  --text-primary:#141414;
  --text-secondary:#54544F;
  --text-tertiary:#8B8B85;
  --accent:#FF5C00;
  --accent-strong:#B33F00;
  --accent-dim:#E65200;
  --accent-tint:rgba(255,92,0,0.10);
  --on-accent:#1B1006;
  --success:#4F7345;
  --success-tint:rgba(79,115,69,0.10);
  --warning:#9C6B27;
  --warning-tint:rgba(156,107,39,0.10);
  --danger:#A84B41;
  --danger-tint:rgba(168,75,65,0.10);
  --info:#4C6C8C;
  --shadow-1:0 1px 2px rgba(20,14,8,.08);
  --shadow-2:0 8px 24px rgba(20,14,8,.12);
  --shadow-glow:0 0 0 1px rgba(255,92,0,.22), 0 0 18px rgba(255,92,0,.12);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  min-height:100vh;
}
html[dir="rtl"] body{font-family:var(--font-arabic);}
img,svg{display:block;}
button{font-family:inherit;}
::selection{background:var(--accent-tint-strong);}

/* focus-visible accessibility ring — consistent across all interactive elements */
:focus-visible{
  outline:2px solid var(--accent-strong);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

/* ============================================================
   Utility classes
   ============================================================ */
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.items-start{align-items:flex-start;}
.items-end{align-items:flex-end;}
.justify-between{justify-content:space-between;}
.justify-center{justify-content:center;}
.wrap{flex-wrap:wrap;}
.w-full{width:100%;}
.grow{flex:1 1 auto;}
.rel{position:relative;}
.text-start{text-align:start;}
.text-center{text-align:center;}
.gap-1{gap:var(--sp-1);} .gap-2{gap:var(--sp-2);} .gap-3{gap:var(--sp-3);}
.gap-4{gap:var(--sp-4);} .gap-5{gap:var(--sp-5);} .gap-6{gap:var(--sp-6);}
.p-0{padding:0;}
.p-3{padding:var(--sp-3);} .p-4{padding:var(--sp-4);} .p-5{padding:var(--sp-5);} .p-6{padding:var(--sp-6);}
.px-4{padding-inline:var(--sp-4);} .px-5{padding-inline:var(--sp-5);} .px-6{padding-inline:var(--sp-6);}
.py-2{padding-block:var(--sp-2);} .py-3{padding-block:var(--sp-3);} .py-4{padding-block:var(--sp-4);}
.mt-1{margin-top:var(--sp-1);} .mt-2{margin-top:var(--sp-2);} .mt-3{margin-top:var(--sp-3);}
.mt-4{margin-top:var(--sp-4);} .mt-5{margin-top:var(--sp-5);} .mt-6{margin-top:var(--sp-6);}
.mb-1{margin-bottom:var(--sp-1);} .mb-2{margin-bottom:var(--sp-2);} .mb-3{margin-bottom:var(--sp-3);}
.mb-4{margin-bottom:var(--sp-4);} .mb-5{margin-bottom:var(--sp-5);} .mb-6{margin-bottom:var(--sp-6);}

/* Type scale */
.t-display-xl{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:40px;letter-spacing:-0.02em;color:var(--text-primary);}
html[dir=rtl] .t-display-xl{font-family:var(--font-arabic);font-weight:700;letter-spacing:0;}
.t-display-lg{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:30px;letter-spacing:-0.01em;color:var(--text-primary);}
html[dir=rtl] .t-display-lg{font-family:var(--font-arabic);letter-spacing:0;}
.t-title{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:24px;color:var(--text-primary);}
html[dir=rtl] .t-title{font-family:var(--font-arabic);}
.t-body-lg{font-weight:500;font-size:15px;line-height:22px;color:var(--text-primary);}
html[dir=rtl] .t-body-lg{font-family:var(--font-arabic);}
.t-body{font-weight:400;font-size:14px;line-height:20px;color:var(--text-secondary);}
html[dir=rtl] .t-body{font-family:var(--font-arabic);}
.t-caption{font-weight:500;font-size:12px;line-height:16px;color:var(--text-tertiary);letter-spacing:0.01em;}
html[dir=rtl] .t-caption{font-family:var(--font-arabic);}
.t-eyebrow{font-weight:600;font-size:11px;line-height:14px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);}
html[dir=rtl] .t-eyebrow{font-family:var(--font-arabic);letter-spacing:0;text-transform:none;}
.t-mono-xl{font-family:var(--font-mono);font-weight:600;font-size:30px;line-height:34px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.t-mono-lg{font-family:var(--font-mono);font-weight:600;font-size:20px;line-height:24px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.t-mono-md{font-family:var(--font-mono);font-weight:600;font-size:15px;line-height:20px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.t-mono-sm{font-family:var(--font-mono);font-weight:500;font-size:12px;line-height:16px;color:var(--text-secondary);font-variant-numeric:tabular-nums;}
.text-secondary{color:var(--text-secondary);}
.text-tertiary{color:var(--text-tertiary);}
.text-accent{color:var(--accent-strong);}
.text-success{color:var(--success);}
.text-warning{color:var(--warning);}
.text-danger{color:var(--danger);}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1;
  border-radius:var(--r-md);border:1px solid transparent;cursor:pointer;
  padding:0 var(--sp-5);height:48px;
  transition:transform var(--dur-1) var(--ease), background var(--dur-1) var(--ease), opacity var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
  white-space:nowrap; -webkit-user-select:none; user-select:none;
}
html[dir=rtl] .btn{font-family:var(--font-arabic);font-weight:600;}
.btn:active{transform:scale(0.97);}
.btn-sm{height:38px;padding:0 var(--sp-4);font-size:13px;border-radius:var(--r-sm);}
.btn-full{width:100%;}
.btn-primary{background:var(--accent);color:var(--on-accent);}
.btn-primary:hover{background:var(--accent-strong);}
.btn-secondary{background:var(--surface-3);color:var(--text-primary);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--accent-strong);}
.btn-ghost{background:transparent;color:var(--text-primary);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-tint);}
.btn-icon{width:44px;height:44px;padding:0;border-radius:var(--r-md);background:var(--surface-2);color:var(--text-primary);}
.btn:disabled{opacity:0.38;cursor:not-allowed;transform:none;}
.btn-loading{color:transparent!important;position:relative;}
.btn-loading::after{
  content:"";position:absolute;width:18px;height:18px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
.btn-secondary.btn-loading::after,.btn-ghost.btn-loading::after{border-color:var(--border-strong);border-top-color:var(--text-primary);}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   Inputs
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:600;color:var(--text-secondary);}
html[dir=rtl] .field label{font-family:var(--font-arabic);}
.input, .select{
  height:50px;border-radius:var(--r-md);border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text-primary);
  padding:0 var(--sp-4);font-size:15px;font-family:inherit;width:100%;
  transition:border-color var(--dur-1) var(--ease);
}
.input::placeholder{color:var(--text-tertiary);}
.input:focus, .select:focus{border-color:var(--accent-strong);outline:none;}
.input-error{border-color:var(--danger);}
.error-text{font-size:12px;color:var(--danger);font-weight:500;}
.helper-text{font-size:12px;color:var(--text-tertiary);}

.stepper{display:flex;align-items:center;gap:var(--sp-3);}
.stepper button{
  width:40px;height:40px;border-radius:var(--r-md);border:1.5px solid var(--border);
  background:var(--surface-2);color:var(--text-primary);font-size:18px;cursor:pointer;
}
.stepper button:active{background:var(--accent-tint);border-color:var(--accent-strong);}
.stepper .val{min-width:64px;text-align:center;font-family:var(--font-mono);font-weight:600;font-size:18px;}

.toggle{width:46px;height:28px;border-radius:var(--r-pill);background:var(--surface-3);border:1.5px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;transition:background var(--dur-2)}
.toggle .knob{position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--text-tertiary);transition:inset-inline-start var(--dur-2) var(--ease), background var(--dur-2);}
.toggle.on{background:var(--accent-tint-strong);border-color:var(--accent-strong);}
.toggle.on .knob{inset-inline-start:20px;background:var(--accent-strong);}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--sp-4);
  border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface-2);
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  transition:all var(--dur-1) var(--ease);
}
html[dir=rtl] .chip{font-family:var(--font-arabic);}
.chip.selected{background:var(--accent-tint);border-color:var(--accent-strong);color:var(--accent-strong);}
.chip.selected::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-strong);}

.segmented{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;border:1px solid var(--border);}
.segmented button{
  flex:1;border:none;background:transparent;padding:9px var(--sp-3);border-radius:9px;
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;
}
.segmented button.active{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-1);}

/* ============================================================
   Cards & surfaces
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--sp-5);
}
.card-flat{background:var(--surface-2);border-radius:var(--r-lg);padding:var(--sp-4);}
.list-item{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) 0;border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}
.icon-badge{
  width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-secondary);
}
.icon-badge.accent{background:var(--accent-tint);color:var(--accent-strong);}
.icon-badge.success{background:var(--success-tint);color:var(--success);}
.icon-badge.warning{background:var(--warning-tint);color:var(--warning);}
.icon-badge.danger{background:var(--danger-tint);color:var(--danger);}

.divider{height:1px;background:var(--border);border:none;margin:var(--sp-4) 0;}

/* premium lock badge */
.pro-badge{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);
  background:linear-gradient(135deg,var(--accent-tint-strong),var(--accent-tint));
  border:1px solid var(--accent-strong);color:var(--accent-strong);font-size:10px;font-weight:700;letter-spacing:0.04em;
}
html[dir=rtl] .pro-badge{font-family:var(--font-arabic);letter-spacing:0;}

.locked{position:relative;overflow:hidden;}
.locked .locked-content{filter:blur(5px);opacity:.5;pointer-events:none;user-select:none;}
.locked-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg, transparent, var(--surface) 65%);
  text-align:center;padding:var(--sp-4);
}
.locked-overlay .lock-circle{
  width:40px;height:40px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent-strong);
  display:flex;align-items:center;justify-content:center;color:var(--accent-strong);box-shadow:var(--shadow-glow);
}

/* avatar / centered confirm modal */
.avatar-btn{
  width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;
  border:none;cursor:pointer;flex-shrink:0;
}
.modal-center{
  position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:250;display:flex;align-items:center;justify-content:center;padding:var(--sp-6);
}
.modal-card{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-lg);
  padding:var(--sp-5);width:100%;box-shadow:var(--shadow-2);
}

/* ============================================================
   Progress components — signature: the Ring
   ============================================================ */
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.ring-wrap svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(255,138,71,.25));}
html[data-theme=light] .ring-wrap svg{filter:none;}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}

.bar-track{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;}
.bar-fill{height:100%;border-radius:var(--r-pill);background:var(--accent-strong);transition:width var(--dur-2) var(--ease);}
.bar-track.thin{height:6px;}

.steps-progress{display:flex;gap:6px;}
.steps-progress .seg{flex:1;height:4px;border-radius:var(--r-pill);background:var(--surface-3);}
.steps-progress .seg.done{background:var(--accent-strong);}
.steps-progress .seg.active{background:var(--border-strong);position:relative;overflow:hidden;}

/* ============================================================
   Charts (lightweight SVG)
   ============================================================ */
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:120px;}
.chart-bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.chart-bars .bar{width:100%;border-radius:6px 6px 3px 3px;background:var(--surface-3);transition:height var(--dur-2) var(--ease);}
.chart-bars .bar.hi{background:var(--accent-strong);}
.chart-bars .lbl{font-size:10px;color:var(--text-tertiary);font-weight:600;}

/* ============================================================
   Dashboard — modular bento grid
   ============================================================ */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.dash-tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--sp-4);display:flex;flex-direction:column;justify-content:space-between;
  gap:var(--sp-3);min-height:112px;
}
.dash-tile.tall{min-height:136px;}
.dash-tile.clickable{cursor:pointer;transition:border-color var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);}
.dash-tile.clickable:active{transform:scale(0.97);}
.dash-tile.clickable:hover{border-color:var(--border-strong);}

/* ============================================================
   Skeleton / loading
   ============================================================ */
.skeleton{background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size:400% 100%; animation:shimmer 1.6s ease-in-out infinite; border-radius:var(--r-sm);}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* empty / error state */
.state-block{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--sp-8) var(--sp-5);gap:var(--sp-3);}
.state-block .state-icon{width:56px;height:56px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);}
.state-block.error .state-icon{background:var(--danger-tint);color:var(--danger);}

/* ============================================================
   Phone frame
   ============================================================ */
.phone{
  width:375px;height:812px;background:var(--bg);border-radius:44px;
  border:10px solid #000; box-shadow:0 30px 60px rgba(0,0,0,.5), 0 0 0 2px #000;
  position:relative;overflow:hidden;flex-shrink:0;
}
html[data-theme=light] .phone{border-color:#111;}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:50;}
.status-bar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:var(--text-primary);}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:var(--text-primary);opacity:.35;}
.phone-screen{height:calc(100% - 46px - 78px);overflow-y:auto;padding:0 var(--sp-5);}
.phone-screen::-webkit-scrollbar{width:0;}
.phone-topbar{padding:var(--sp-2) 0 var(--sp-4);}

.bottom-nav{
  position:absolute;left:14px;right:14px;bottom:14px;height:64px;
  background:rgba(18,18,18,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);border-radius:999px;
  display:flex;align-items:center;justify-content:space-around;padding:0 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.bottom-nav .nav-item{
  position:relative;flex:1;max-width:52px;height:48px;display:flex;align-items:center;justify-content:center;
  border-radius:999px;color:rgba(255,255,255,.5);
  background:none;border:none;cursor:pointer;font-family:inherit;
  transition:background var(--dur-2) var(--ease),color var(--dur-2) var(--ease);
}
.bottom-nav .nav-item.active{background:rgba(255,255,255,.14);color:#fff;}
.bottom-nav .nav-item .nav-dot{
  position:absolute;top:6px;inset-inline-end:11px;width:7px;height:7px;border-radius:50%;
  background:var(--danger);border:1.5px solid rgba(18,18,18,.9);
}

/* ============================================================
   Shell / layout for this document
   ============================================================ */
.shell{max-width:1400px;margin:0 auto;padding:var(--sp-6) var(--sp-6) 100px;}
.top-shell{
  position:sticky;top:0;z-index:100;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.top-shell-inner{max-width:1400px;margin:0 auto;padding:var(--sp-4) var(--sp-6);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:800;font-family:var(--font-mono);font-size:15px;box-shadow:var(--shadow-glow);}
.brand .name{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-0.01em;}
.brand .tagline{font-size:11px;color:var(--text-tertiary);}

.main-tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:var(--r-md);border:1px solid var(--border);}
.main-tabs button{border:none;background:transparent;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.main-tabs button.active{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-1);}

.icon-toggle{width:38px;height:38px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:var(--sp-9) 0 var(--sp-4);}
.section-h .num{font-family:var(--font-mono);color:var(--accent-strong);font-size:13px;margin-inline-end:8px;}
.grid{display:grid;gap:var(--sp-4);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}

/* ============================================================
   Admin Dashboard (web/desktop)
   ============================================================ */
.admin-shell{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;min-height:760px;box-shadow:var(--shadow-2);}
.admin-sidebar{width:224px;flex-shrink:0;background:var(--bg);border-inline-end:1px solid var(--border);padding:var(--sp-5) var(--sp-3);display:flex;flex-direction:column;gap:2px;}
.admin-brand{display:flex;align-items:center;gap:9px;padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-5);}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);color:var(--text-secondary);font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;text-align:start;width:100%;font-family:inherit;transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);}
.admin-nav-item:hover{background:var(--surface-2);color:var(--text-primary);}
.admin-nav-item.active{background:var(--accent-tint);color:var(--accent-strong);}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.admin-topbar{height:64px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-6);gap:var(--sp-4);}
.admin-content{padding:var(--sp-6);overflow-y:auto;}
.admin-search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px;height:38px;color:var(--text-tertiary);font-size:13px;}
.stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-4);}
.stat-card .stat-value{font-family:var(--font-mono);font-weight:700;font-size:26px;color:var(--text-primary);}
.stat-delta{font-size:12px;font-weight:700;}
.stat-delta.up{color:var(--success);}
.stat-delta.down{color:var(--danger);}
.a-table{width:100%;border-collapse:collapse;}
.a-table th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-tertiary);font-weight:600;padding:12px var(--sp-4);border-bottom:1px solid var(--border);background:var(--surface-2);}
.a-table td{padding:11px var(--sp-4);border-bottom:1px solid var(--border);font-size:13px;color:var(--text-primary);vertical-align:middle;}
.a-table tr:last-child td{border-bottom:none;}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;white-space:nowrap;}
.status-pill.on{background:var(--success-tint);color:var(--success);}
.status-pill.off{background:var(--surface-3);color:var(--text-tertiary);}
.status-pill.warn{background:var(--warning-tint);color:var(--warning);}
.status-pill.bad{background:var(--danger-tint);color:var(--danger);}
@media (max-width:960px){
  .admin-shell{flex-direction:column;min-height:0;}
  .admin-sidebar{width:100%;flex-direction:row;overflow-x:auto;border-inline-end:none;border-bottom:1px solid var(--border);}
  .admin-brand{display:none;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
.swatch{border-radius:var(--r-md);height:64px;display:flex;align-items:flex-end;padding:8px;border:1px solid var(--border);}
.swatch span{font-family:var(--font-mono);font-size:10px;background:rgba(0,0,0,.35);color:#fff;padding:2px 6px;border-radius:4px;}

.phones-row{display:flex;gap:var(--sp-7);flex-wrap:wrap;align-items:flex-start;}
.phone-caption{text-align:center;margin-top:var(--sp-3);font-size:13px;font-weight:600;color:var(--text-secondary);}

@media (max-width:900px){
  .phones-row{justify-content:center;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
}

/* ============================================================
   Shared components (render functions)
   ============================================================ */
function ring(pct, size, stroke, colorVar, centerHtml){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (Math.min(pct,100)/100) * c;
  return `
  <div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-3)" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${colorVar}" stroke-width="${stroke}" fill="none"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset var(--dur-2) var(--ease)"/>
    </svg>
    <div class="ring-center">${centerHtml}</div>
  </div>`;
}

function statusRow(iconName, label, valueText, statusText, statusType){
  // statusType: good | warn | bad
  const colorVar = statusType==='good' ? 'var(--success)' : statusType==='warn' ? 'var(--warning)' : 'var(--danger)';
  const badgeBg = statusType==='good' ? 'var(--success-tint)' : statusType==='warn' ? 'var(--warning-tint)' : 'var(--danger-tint)';
  return `
  <div class="list-item">
    <div class="icon-badge">${icon(iconName,18)}</div>
    <div class="grow">
      <div class="t-body-lg">${label}</div>
      <div class="t-caption">${valueText}</div>
    </div>
    <div style="background:${badgeBg};color:${colorVar};padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;">${statusText}</div>
  </div>`;
}

function histRow(a,b,c){
  return `<div class="list-item">
    <div class="grow t-body-lg">${a}</div>
    <div class="t-mono-sm">${b}</div>
    <div class="t-caption" style="margin-inline-start:10px;color:var(--success)">${c}</div>
  </div>`;
}
function lineChartSvg(){
  const pts=[40,38,34,36,30,28,24,26,20,18];
  const w=295,h=90,step=w/(pts.length-1),max=Math.max(...pts),min=Math.min(...pts);
  const norm = v => h - ((v-min)/(max-min))*h*0.85 - 5;
  const d = pts.map((v,i)=>`${i===0?'M':'L'} ${i*step} ${norm(v)}`).join(' ');
  const area = d + ` L ${w} ${h} L 0 ${h} Z`;
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <path d="${d}" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
